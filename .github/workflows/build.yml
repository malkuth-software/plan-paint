name: Native builds
# Plan Paint's CI through template_harness (projects/plan-paint.toml, pinned
# by harness.lock). Plan Paint is its harness workspace's root, so the
# harness is checked out at template_harness/ inside the checkout. Each host
# restores its LLVM 22.1.8 toolchain with the harness's tools, builds the
# pinned GUI.Forms source and Plan Paint, runs the tests and packages.
# "Plan Paint CI summary" always reports and is the check branch protection
# requires.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested packages from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Select one tested publication version
        id: version
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: python3 scripts/publication_version.py
      - name: Test publication contracts
        run: python3 -m unittest discover -s tests -p test_publication.py
  # The harness's spelling and lifetime checks over first-party C++. The
  # @commit must equal harness.lock.
  house-style:
    uses: malkuth-software/template_harness/.github/workflows/harness-house-style.yml@5c95a7710f4ec8970cc58698ce259ed41e14ff6a
    with:
      product_path: .
      paths: src tests
      lifetime_paths: src tests
  application:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      PAINT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_JOBS: 2
      PAINT_CLIPBOARD_TEST_ISOLATED: 1
      CC: clang
      CXX: clang++
      OBJCXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
      HARNESS_PROJECT: ${{ github.workspace }}/template_harness/projects/plan-paint.toml
      HARNESS_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # The harness at the commit harness.lock pins, at template_harness/.
      - name: Read the harness pin
        id: harness
        shell: bash
        run: |
          echo "repository=$(sed -n 's/^repository = "\(.*\)"$/\1/p' harness.lock)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"$/\1/p' harness.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.harness.outputs.repository }}
          ref: ${{ steps.harness.outputs.commit }}
          path: template_harness
          persist-credentials: false
      - name: Verify the harness commit
        shell: bash
        env:
          COMMIT: ${{ steps.harness.outputs.commit }}
        run: test "$(git -C template_harness rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib zstd unpacks the Windows toolchain; the build keeps 3.12.
      - uses: actions/setup-python@v5
        id: toolchain-python
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
          update-environment: false
      # GUI.Forms' published CLANG64 toolchain (the project's [toolchain]),
      # restored without MSYS2 mirrors; it puts msys2.cmd on PATH.
      - name: Restore the published Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: '"$TOOLCHAIN_PYTHON" template_harness/harness/windows_toolchain.py restore'
      - name: Install Windows codecs without upgrading the compiler
        if: runner.os == 'Windows'
        run: pacman -Sy --needed --noconfirm mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-libwebp mingw-w64-clang-x86_64-dav1d
      - name: Install macOS compiler and codecs
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cmake ninja llvm@22 ccache pkgconf meson
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          # GUI.Forms and the packager read GUI_FORMS_LLVM_RUNTIME; the
          # harness toolchain file reads HARNESS_LLVM_RUNTIME.
          echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
          echo "HARNESS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      # The project file's [linux_packages.paint] and apt.llvm.org's clang-22;
      # the downloaded packages are kept per runner image.
      - name: Name the Linux package cache
        id: linux-image
        if: runner.os == 'Linux'
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: linux-packages
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: plan-paint-debs-v1-paint-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/plan-paint.toml') }}-${{ steps.linux-image.outputs.image }}
          restore-keys: plan-paint-debs-v1-paint-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/plan-paint.toml') }}-
      - name: Install Linux compiler and desktop libraries
        if: runner.os == 'Linux'
        run: sh template_harness/harness/install_linux_ci_packages.sh paint "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache/save@v4
        if: runner.os == 'Linux' && github.event_name == 'push' && steps.linux-packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      - name: Identify and verify the LLVM release compiler
        id: compiler
        run: python template_harness/harness/compiler_identity.py
      - name: Fetch the pinned GUI.Forms source
        run: python3 scripts/fetch-gui-forms.py
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .ccache
          key: plan-paint-objects-v1-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-${{ github.sha }}
          restore-keys: plan-paint-objects-v1-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-
      - name: Import verified toolkit compiler cache and macOS runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/restore-toolkit-cache.py '${{ matrix.platform }}'
      - name: Configure compiler cache
        run: |
          cache_dir="$PWD/.ccache"
          cache_base="$PWD"
          if command -v cygpath >/dev/null; then
            cache_dir="$(cygpath -m "$cache_dir")"
            cache_base="$(cygpath -m "$cache_base")"
          fi
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$cache_base" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          ccache --zero-stats
      - uses: actions/cache@v4
        with:
          path: |
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            gui_forms/third_party/libunibreak
            .build/native/app/_deps/*-src
          key: plan-paint-sources-v1-${{ matrix.platform }}-${{ hashFiles('third_party/gui-forms.lock.json', 'CMakeLists.txt', 'cmake/ImportFormats.cmake') }}
      # The compiler identity plus the macOS runtime: what the codecs and
      # Skia built from source depend on.
      - name: Identify renderer environment
        if: runner.os != 'Windows'
        env:
          COMPILER_IDENTITY: ${{ steps.compiler.outputs.identity }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          identity = os.environ['COMPILER_IDENTITY'].encode()
          runtime = Path(os.environ.get('GUI_FORMS_LLVM_RUNTIME', '.build/no-runtime')) / 'runtime-manifest.json'
          if runtime.exists(): identity += runtime.read_bytes()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PAINT_RENDERER_ENV=' + hashlib.sha256(identity).hexdigest() + '\n')
          PYTHON
      - uses: actions/cache/restore@v4
        id: codecs-cache
        if: runner.os == 'macOS'
        with:
          path: .build/codecs-macos14
          key: plan-paint-codecs-macos14-v1-${{ env.PAINT_RENDERER_ENV }}-${{ hashFiles('scripts/build-macos-codecs.sh') }}
      - name: Build macOS 14 codecs
        if: runner.os == 'macOS'
        run: sh scripts/build-macos-codecs.sh
      - uses: actions/cache/save@v4
        if: runner.os == 'macOS' && steps.codecs-cache.outputs.cache-hit != 'true'
        with:
          path: .build/codecs-macos14
          key: ${{ steps.codecs-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: renderer-cache
        if: runner.os != 'Windows'
        with:
          path: gui_forms/third_party/skia
          key: plan-paint-skia-llvm22-v1-${{ matrix.platform }}-${{ env.PAINT_RENDERER_ENV }}-${{ hashFiles('gui_forms/third_party/*skia*') }}
      - name: Build CPU renderer
        if: runner.os != 'Windows'
        run: |
          if [ ! -f gui_forms/third_party/skia/out/paint/libskia.a ]; then
            if [ "${{ runner.os }}" = macOS ]; then
              sh gui_forms/third_party/fetch_skia_cpu.sh
              sh gui_forms/third_party/build_skia_cpu.sh "$PWD/gui_forms/third_party/skia/out/paint"
            else
              GUI_FORMS_SYSTEM_BUILD_TOOLS=1 sh gui_forms/third_party/fetch_skia_cpu.sh
              sh gui_forms/third_party/build_skia_cpu_linux.sh "$PWD/gui_forms/third_party/skia/out/paint"
            fi
          fi
      - uses: actions/cache/save@v4
        if: runner.os != 'Windows' && steps.renderer-cache.outputs.cache-hit != 'true'
        with:
          path: gui_forms/third_party/skia
          key: ${{ steps.renderer-cache.outputs.cache-primary-key }}
      - name: Configure application
        run: sh scripts/native-build.sh configure '${{ matrix.platform }}'
      - name: Build application and tests
        run: sh scripts/native-build.sh build '${{ matrix.platform }}'
      # Only a push saves objects: a pull request's cache reaches no other ref.
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Test application
        run: |
          export PAINT_NATIVE_CAPTURE="$PWD/.build/native/native-canvas.png"
          if [ "${{ runner.os }}" = Linux ]; then
            xvfb-run -a sh scripts/native-build.sh test '${{ matrix.platform }}'
          else
            sh scripts/native-build.sh test '${{ matrix.platform }}'
          fi
      - name: Package application
        run: sh scripts/native-build.sh package '${{ matrix.platform }}'
      - name: Exercise packaged native window
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            xvfb-run -a python3 scripts/smoke-package.py 'dist/PlanPaint/Plan Paint'
          elif [ "${{ runner.os }}" = macOS ]; then
            python3 scripts/smoke-package.py 'dist/Plan Paint.app/Contents/MacOS/plan-paint'
          else
            python3 scripts/smoke-package.py dist/PlanPaint/plan-paint.exe
          fi
      # Workflow artifacts beginning plan-paint- belong to the harness
      # (projects/plan-paint.toml artifact_prefix), so packages are packages-*.
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.pkg
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-checks-${{ matrix.platform }}
          path: |
            .build/native/app/Testing/Temporary/LastTest.log
            .build/native/native-canvas.png
          include-hidden-files: true
  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, house-style, application]
    runs-on: ubuntu-24.04
    concurrency:
      group: paint-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Publish exactly the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish_tested_release.py --artifacts dist
  # The one check branch protection requires: it always runs and passes only
  # when every job above succeeded (release is skipped off main).
  summary:
    name: Plan Paint CI summary
    if: always()
    needs: [prepare, house-style, application, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          failed = []
          for name, job in sorted(needs.items()):
              result = job['result']
              allowed = ('success', 'skipped') if name == 'release' else ('success',)
              print(name + ': ' + result)
              if result not in allowed:
                  failed.append(name)
          if failed:
              sys.exit('Not passed: ' + ', '.join(failed))
          PYTHON
